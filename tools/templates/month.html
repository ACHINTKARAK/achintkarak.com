<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{{ month.title }} — Achint Karak</title>
  <meta
    name="description"
    content="Index for {{ month.title }} — Achint Karak’s photo journal."
  />
  <link rel="stylesheet" href="/styles.css?v={{ css_version }}" />
  <script src="/site.js?v={{ js_version }}"></script>
</head>
<body>
  <main class="wrap month-page">

    <div class="settings">
      <button
        class="gear"
        id="settingsToggle"
        type="button"
        aria-label="Settings"
        aria-expanded="false"
        aria-controls="settingsMenu"
      >⚙</button>

      <div class="menu" id="settingsMenu" aria-label="Settings menu" hidden>
        <button class="menu-item" id="themeToggle" type="button">Dark</button>
        <a class="menu-item" href="/about/">About</a>
      </div>
    </div>

    <nav class="crumbs">
      <a href="/">Home</a>
      <span class="sep">/</span>
      <span class="current">{{ month.title }}</span>
    </nav>

    <header class="meta">
      <div class="date">{{ month.title }}</div>
    </header>

    <nav class="index" aria-label="{{ month.title }} albums">
      {% for album in month.albums %}
      <a href="{{ album.url }}">{{ album.title }}</a>
      {% endfor %}
    </nav>

    <div class="pills month-home">
      <a class="btn" href="/">Home</a>
    </div>

    <footer class="footer">
      © Achint Karak — Photo Journal
    </footer>
  </main>
</body>
</html>
