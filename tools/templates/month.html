<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />

  <script>
    (function () {
      try {
        var savedTheme = localStorage.getItem("ak_theme");

        if (savedTheme === "dark" || savedTheme === "light") {
          document.documentElement.setAttribute(
            "data-theme",
            savedTheme
          );
        }
      } catch (error) {
        // Continue with the default light theme.
      }
    }());
  </script>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{{ month.title }} — Achint Karak</title>
  <meta
    name="description"
    content="Index for {{ month.title }} — Achint Karak’s photo journal."
  />
  <link rel="canonical" href="{{ site_url }}/journal/{{ month.id }}/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Achint Karak — Photo Journal" />
  <meta property="og:title" content="{{ month.title }} — Achint Karak" />
  <meta
    property="og:description"
    content="Index for {{ month.title }} — Achint Karak’s photo journal."
  />
  <meta property="og:url" content="{{ site_url }}/journal/{{ month.id }}/" />
  <link rel="stylesheet" href="/styles.css?v={{ css_version }}" />
  <script src="/site.js?v={{ js_version }}"></script>
</head>
<body>
  <main class="wrap month-page">

    <nav class="top-nav" aria-label="Primary navigation">
      <a class="top-link" href="/about/">About</a>
      <button
        class="theme-toggle"
        id="themeToggle"
        type="button"
        aria-label="Use dark theme"
        title="Use dark theme"
      >◐</button>
    </nav>

    <nav class="crumbs">
      <a href="/">Home</a>
      <span class="sep">/</span>
      <span class="current">{{ month.title }}</span>
    </nav>

    <header class="meta">
      <div class="date">{{ month.title }}</div>
    </header>

    <nav class="index" aria-label="{{ month.title }} albums">
      {% for album in month.albums %}
      <a href="{{ album.url }}">{{ album.title }}</a>
      {% endfor %}
    </nav>

    <div class="pills month-home">
      <a class="btn" href="/">Home</a>
    </div>

    <footer class="footer">
      © Achint Karak
    </footer>
  </main>
</body>
</html>
