<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>About — Achint Karak</title>
  <meta
    name="description"
    content="About Achint Karak and his quiet photographic journal."
  />
  <link rel="stylesheet" href="/styles.css?v={{ css_version }}" />
  <script src="/site.js?v={{ js_version }}"></script>
</head>
<body>
  <main class="wrap about-page">

    <div class="settings">
      <button
        class="gear"
        id="settingsToggle"
        type="button"
        aria-label="Settings"
        aria-expanded="false"
        aria-controls="settingsMenu"
      >⚙</button>

      <div class="menu" id="settingsMenu" aria-label="Settings menu" hidden>
        <button class="menu-item" id="themeToggle" type="button">Dark</button>
        <a class="menu-item" href="/">Home</a>
      </div>
    </div>

    <header class="meta">
      <div class="date">About</div>
    </header>

    <section class="about">
      <p>
        A long-term photo journal by Achint Karak.
        It began as a way to capture moments as they pass.
      </p>

      <p>
        For correspondence:
        <br />
        <a href="mailto:journal@achintkarak.com">
          journal@achintkarak.com
        </a>
      </p>
    </section>

    <nav class="pills">
      <a class="btn" href="/">Home</a>
    </nav>

    <footer class="footer">
      © Achint Karak — Photo Journal
    </footer>
  </main>
</body>
</html>
