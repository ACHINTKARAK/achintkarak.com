<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <script>
    (function () {
      try {
        var theme = localStorage.getItem("ak_theme");
        if (theme === "dark" || theme === "light") {
          document.documentElement.setAttribute("data-theme", theme);
        }
      } catch (error) {}
    }());
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Privacy — Achint Karak</title>
  <meta name="description" content="Privacy and analytics preferences for Achint Karak's photo journal." />
  <link rel="canonical" href="https://achintkarak.com/privacy/" />
  <link rel="stylesheet" href="/styles.css" />
  <script src="/site.js"></script>
  <script defer src="/analytics/ga4-consent.js"></script>
  <style>
    .privacy-content { max-width: 560px; margin: 0 auto; font-size: 14px; }
    .privacy-content h2 { font-size: 17px; font-weight: normal; margin: 2rem 0 .6rem; }
    .privacy-content p { line-height: 1.8; margin: 0 0 1.1rem; }
    .privacy-actions { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 1.25rem; }
    .privacy-actions button { padding: .5rem .85rem; background: transparent; color: var(--text);
      border: 1px solid var(--hair); font: inherit; font-size: 13px; cursor: pointer; }
    .privacy-actions button:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
    .privacy-content a { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="wrap about-page">
    <nav class="top-nav" aria-label="Primary navigation">
      <a class="top-link" href="/about/">About</a>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Use dark theme" title="Use dark theme">◐</button>
    </nav>
    <header class="meta"><div class="date">Privacy</div></header>
    <section class="privacy-content" aria-label="Privacy information">
      <p>This journal uses optional Google Analytics to understand how visitors explore it. With your consent, cookies and basic usage data may be collected.</p>

      <p>You can change your choice anytime. No advertising tracking is used.</p>

      <p><a href="https://policies.google.com/privacy" target="_blank" rel="noopener noreferrer">Google's privacy policy</a></p>

      <div class="privacy-actions">
        <button type="button" id="ak-open-privacy">Change analytics choice</button>
        <button type="button" id="ak-withdraw-privacy">Reject analytics</button>
      </div>
    </section>
    <nav class="pills"><a class="btn" href="/">Home</a></nav>
    <footer class="footer">© Achint Karak</footer>
  </main>
</body>
</html>
