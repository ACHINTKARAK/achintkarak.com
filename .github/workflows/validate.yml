name: Validate photo journal

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Generate and verify site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check generator syntax
        run: python -m py_compile tools/build.py

      - name: Build without interactive prompts
        run: python tools/build.py --no-prompt

      - name: Verify published album files
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path.cwd()
          journal = json.loads((root / "journal/journal.json").read_text(encoding="utf-8-sig"))
          count = 0

          for month in journal["months"]:
              for album in month["albums"]:
                  folder = root / "journal" / month["id"] / album["slug"]
                  assert (folder / "index.html").is_file(), folder
                  assert int(album["count"]) == 7, (folder, album["count"])
                  for number in range(1, 8):
                      image = folder / f'{number}.{album["ext"]}'
                      assert image.is_file(), image
                  count += 1

          assert count > 0, "No albums found"
          assert (root / "index.html").is_file()
          assert (root / "sitemap.xml").is_file()
          print(f"Validated {count} seven-image albums.")
          PY

      - name: Generated pages must be committed
        run: git diff --exit-code -- index.html about/index.html sitemap.xml journal
